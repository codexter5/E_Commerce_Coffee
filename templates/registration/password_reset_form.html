{% extends 'base.html' %}

{% block title %}Reset Password - BrewMart{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card">
                <div class="card-header bg-light">
                    <h3 class="mb-0">Reset Your Password</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted mb-4">Enter your email address and we'll send you a link to reset your password.</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-dark btn-lg">Send Reset Link</button>
                        </div>
                    </form>

                    <hr>

                    <div class="text-center">
                        <p class="mb-0">Remember your password? <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
