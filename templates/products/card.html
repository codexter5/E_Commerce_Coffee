<div class="col-md-3 mb-4"><div class="card h-100"><div class="card-body">{% if product.image %}<img class="img-fluid mb-2" src="{{ product.image.url }}" alt="{{ product.name }}">{% endif %}<small class="text-muted">{{ product.category }}</small><h5><a class="text-dark text-decoration-none" href="{{ product.get_absolute_url }}">{{ product.name }}</a></h5><strong>Rs. {{ product.current_price }}</strong></div><div class="card-footer bg-white"><form method="post" action="{% url 'cart:add' product.id %}">{% csrf_token %}<input type="hidden" name="next" value="{{ request.path }}"><button class="btn btn-dark w-100" {% if not product.stock_quantity %}disabled{% endif %}>Add to cart</button></form></div></div></div>
