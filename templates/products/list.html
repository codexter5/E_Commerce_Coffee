{% extends 'base.html' %}

{% block content %}
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1>Products</h1>
            <p class="text-muted">Browse our complete inventory</p>
        </div>
        <form method="get" class="d-flex gap-2">
            <select name="sort" onchange="this.form.submit()" class="form-select" style="width: auto;">
                <option value="newest" selected>Newest</option>
                <option value="price_asc">Price: Low to High</option>
                <option value="price_desc">Price: High to Low</option>
            </select>
        </form>
    </div>

    <div class="row">
        {% for product in products %}
            {% include 'products/card.html' %}
        {% empty %}
            <div class="col-12">
                <div class="alert alert-info text-center">
                    <h5>No products found</h5>
                    <p class="mb-0">Please try adjusting your search criteria</p>
                </div>
            </div>
        {% endfor %}
    </div>
{% endblock %}
