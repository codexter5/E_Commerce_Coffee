{% extends 'base.html' %}

{% block title %}Register - BrewMart{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-light">
                    <h3 class="mb-0">Create Your Account</h3>
                </div>
                <div class="card-body">
                    <p class="text-muted mb-4">Join BrewMart to start shopping premium coffee products</p>
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-dark btn-lg">Create Account</button>
                        </div>
                    </form>

                    <hr>

                    <div class="text-center">
                        <p class="mb-0">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-bold">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
