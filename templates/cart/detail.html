{% extends 'base.html' %}{% block content %}<h1>Your cart</h1>{% for item in items %}<div class="card mb-2"><div class="card-body d-flex justify-content-between align-items-center"><span>{{ item.product.name }} — Rs. {{ item.total }}</span><form method="post" action="{% url 'cart:update' item.id %}">{% csrf_token %}<input name="quantity" type="number" min="0" max="{{ item.product.stock_quantity }}" value="{{ item.quantity }}"><button class="btn btn-sm btn-outline-dark">Update</button></form></div></div>{% empty %}<p>Your cart is empty.</p>{% endfor %}{% if items %}<h4 class="mt-3">Subtotal: Rs. {{ subtotal }}</h4><a class="btn btn-dark" href="{% url 'orders:checkout' %}">Checkout</a>{% endif %}{% endblock %}
